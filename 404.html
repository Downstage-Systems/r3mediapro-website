<!doctype html>
<!--
  Custom 404 for GitHub Pages.

  Doubles as the case-forgiving catch for the Video Tracker link: Pages paths are
  case-sensitive, so /vt would otherwise dead-end. Anyone typing it in any casing
  lands here and is bounced to the real page at /VT/.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found &mdash; R3 Media Production</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/assets/favicon-r3-32.png" sizes="32x32">
<script>
  // Send case-variant tracker URLs (/vt, /Vt, /vT, with or without a slash)
  // to the canonical page. Guarded so the canonical path can never loop.
  (function(){
    var p = location.pathname.replace(/\/+$/,'').toLowerCase();
    if((p === '/vt' || p === '/videotracker' || p === '/video-tracker')
        && location.pathname !== '/VT/'){
      location.replace('/VT/');
    }
  })();
</script>
<style>
  :root{
    --bg:#0c0c0e; --card:#17171b; --line:#2a2a30;
    --text:#f4f4f5; --muted:#9d9da6; --red:#e63946;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    display:grid; place-items:center; padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased; text-align:center;
  }
  .box{max-width:460px}
  .code{
    font-size:12px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
    color:var(--red); margin:0 0 12px;
  }
  h1{font-size:clamp(26px,6vw,34px); font-weight:800; letter-spacing:-.02em; margin:0 0 12px}
  p{color:var(--muted); margin:0 0 26px; font-size:15.5px}
  .links{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
  a.btn{
    display:inline-block; padding:12px 20px; border-radius:10px; text-decoration:none;
    font-weight:700; font-size:14.5px; border:1px solid var(--line);
    background:var(--card); color:var(--text);
  }
  a.btn:hover{border-color:#3a3a42}
  a.btn.pri{background:var(--text); color:#0c0c0e; border-color:var(--text)}
</style>
  <script src="js/analytics.js" defer></script>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>We couldn't find that page</h1>
    <p>The link may be out of date, or the address slightly off.</p>
    <div class="links">
      <a class="btn pri" href="/">Go to the homepage</a>
      <a class="btn" href="/contact.html">Contact us</a>
    </div>
  </div>
</body>
</html>
