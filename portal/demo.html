function b64ToBytes(b64) {
  return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
}

async function unlock() {
  const btn = document.getElementById('unlock-btn');
  const err = document.getElementById('err');
  err.style.display = 'none';
  btn.textContent = 'Unlocking…';
  try {
    const {s, i, d} = JSON.parse(atob(PAYLOAD));
    const pw = document.getElementById('pw').value.trim();
    const keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name: 'PBKDF2', salt: b64ToBytes(s), iterations: 310000, hash: 'SHA-256'},
      keyMaterial, {name: 'AES-GCM', length: 256}, false, ['decrypt']
    );
    const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64ToBytes(i)}, key, b64ToBytes(d));
    const html = new TextDecoder().decode(plain);
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    err.style.display = 'block';
    btn.textContent = 'Unlock';
  }
}
</script>
