<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Your Event | R3 Media Production</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .badge{
      display:inline-block; padding:5px 13px; border-radius:20px; font-size:.75rem;
      font-weight:700; letter-spacing:.04em; white-space:nowrap;
    }
    .vt .btns .badge{ margin-left:8px; }
    .day-head{
      font-size:.8rem; text-transform:uppercase; letter-spacing:.14em; color:var(--muted);
      font-weight:800; padding:26px 12px 8px;
    }
    .live{
      display:inline-flex; align-items:center; gap:7px; font-size:.78rem; color:var(--muted);
    }
    .live i{ width:7px; height:7px; border-radius:50%; background:#2ea86a; display:block; }
    .muted{ color:var(--muted); }
    .vt .note{
      margin-top:7px; font-size:.86rem; color:#bcd4f7; line-height:1.45;
      border-left:2px solid rgba(61,139,253,.55); padding-left:10px; max-width:64ch;
    }
    .gate-logo{ display:flex; flex-direction:column; align-items:center; gap:9px; margin-bottom:24px; }
    .gate-logo img{ height:56px; width:auto; }
    .gate-logo .mp{ height:13px; filter:invert(1) brightness(1.6); opacity:.92; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="wrap nav">
    <a class="brand" href="../index.html">
      <img src="../assets/r3-mark.png" alt="R3 Media Production logo">
      <img class="mp-text" src="../assets/mp-text.png" alt="Media Production">
    </a>
    <nav class="links" style="display:flex;">
      <span style="color:var(--muted); font-size:0.85rem; letter-spacing:0.12em; text-transform:uppercase; font-weight:700;">Client Portal</span>
    </nav>
  </div>
</header>

<!-- password gate -->
<section id="gate">
  <div class="page-hero"><div class="wrap" style="text-align:center;">
    <div class="gate-logo">
      <img src="../assets/r3-mark.png" alt="R3 Media Production">
      <img class="mp" src="../assets/mp-text.png" alt="Media Production">
    </div>
    <h1 style="font-size:clamp(1.6rem,3.5vw,2.2rem);">This page is password protected</h1>
    <p style="margin:12px auto 0; max-width:44ch;">Enter the password from your delivery email to see your session videos.</p>
  </div></div>
  <div class="block" style="padding:50px 0 80px;">
    <div class="wrap" style="max-width:420px;">
      <form class="quote" style="grid-template-columns:1fr;" onsubmit="event.preventDefault(); unlock();">
        <div>
          <label for="pw">Password</label>
          <input type="password" id="pw" autocomplete="current-password" required>
        </div>
        <div>
          <button id="unlock-btn" type="submit" class="btn" style="border:0; cursor:pointer; font-size:1rem; width:100%;">Unlock</button>
        </div>
        <p id="err" style="display:none; color:#e63946; margin:0; text-align:center; font-size:0.9rem;"></p>
      </form>
    </div>
  </div>
</section>

<!-- the live board -->
<section id="board" style="display:none;">
  <div class="page-hero"><div class="wrap">
    <h1 id="ev-name">Your Event</h1>
    <p id="ev-sum" class="muted"></p>
  </div></div>

  <div class="block" style="padding:44px 0 90px;">
    <div class="wrap">
      <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:6px;">
        <span class="live"><i id="dot"></i> <span id="live-txt">Live &mdash; updates as we finish each edit</span></span>
        <span style="flex:1"></span>
        <button class="btn ghost" style="border:1px solid var(--line); cursor:pointer;" onclick="refresh(true)">Refresh</button>
      </div>
      <div class="vt-wrap">
        <table class="vt" id="tbl"></table>
      </div>
      <p class="muted" style="font-size:.85rem; margin-top:22px;">
        Questions about any of these? Email <a href="mailto:rob@r3mediapro.com">rob@r3mediapro.com</a>.
      </p>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom" style="margin-top:0; padding-top:0; border-top:0;">
      <span>&copy; 2026 R3 Media Production</span>
      <span><a href="../index.html">r3mediapro.com</a></span>
    </div>
  </div>
</footer>

<script>
/* -------------------------------------------------------------------------
   Reads the same Google Sheet the editing tracker writes to, so a status
   change or a new video link shows up here without anyone touching this file.
   Set API to the Apps Script /exec URL.
   ------------------------------------------------------------------------- */
const API = 'https://script.google.com/macros/s/AKfycby94roLBTLGid0d_bpyT6FNMweixw0lqzAmzEdDDmHthAgxAXkY0egUWse8DsFRxzvn/exec';

const COLOURS = {
  notstarted: '#6b6b74', editing: '#d98324', exported: '#3d8bfd',
  uploaded: '#8b5cf6', delivered: '#2ea86a'
};

const params = new URLSearchParams(location.search);
const EVENT = (params.get('event') || '').toLowerCase();
let password = sessionStorage.getItem('r3-pw-' + EVENT) || '';
let timer = null;

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function timeHuman(hhmm){
  if (!hhmm) return '';
  const [h, m] = String(hhmm).split(':').map(Number);
  if (isNaN(h)) return String(hhmm);
  const ap = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return h12 + ':' + String(m || 0).padStart(2, '0') + ' ' + ap;
}

function roomLabel(code, name){
  if (name) return name;
  if (!code) return '';
  let m;
  if ((m = code.match(/^BO(\d+)$/i)))   return 'Breakout ' + m[1];
  if ((m = code.match(/^TR(.+)$/i)))    return 'Track ' + m[1];
  if ((m = code.match(/^RM(.+)$/i)))    return 'Room ' + m[1];
  if (code.toUpperCase() === 'MAIN')    return 'Main Stage';
  if (code.toUpperCase() === 'GS')      return 'General Session';
  if (code.toUpperCase() === 'KEY')     return 'Keynote Hall';
  // Last resort: SENATE1 -> Senate 1, so a client never sees a raw code.
  m = code.match(/^([A-Za-z]{2,})(\d[\d+&-]*)$/);
  if (m) return m[1].charAt(0).toUpperCase() + m[1].slice(1).toLowerCase() + ' ' + m[2];
  return code;
}

async function fetchBoard(){
  if (!API || API.indexOf('PASTE_YOUR') === 0){
    throw new Error('This page hasn’t been connected to the tracker yet (setup step 4). ' +
                    'Contact rob@r3mediapro.com.');
  }
  const url = API + '?mode=portal&event=' + encodeURIComponent(EVENT) + '&pw=' + encodeURIComponent(password);
  let res;
  try {
    res = await fetch(url, { redirect: 'follow' });
  } catch (e){
    throw new Error('Could not reach the server — check your internet connection.');
  }
  if (!res.ok) throw new Error('The server returned an error (' + res.status + ').');
  return res.json();
}

async function unlock(){
  const btn = document.getElementById('unlock-btn'), err = document.getElementById('err');
  password = document.getElementById('pw').value.trim();
  err.style.display = 'none'; btn.textContent = 'Unlocking…';
  try {
    const data = await fetchBoard();
    if (!data.ok) throw new Error(data.error === 'bad password'
      ? 'That password didn’t match. Check your delivery email, or contact rob@r3mediapro.com.'
      : 'We couldn’t find that event. Check the link in your delivery email.');
    sessionStorage.setItem('r3-pw-' + EVENT, password);
    showBoard(data);
  } catch (e){
    err.textContent = e.message;
    err.style.display = 'block';
    btn.textContent = 'Unlock';
  }
}

function showBoard(data){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('board').style.display = 'block';
  render(data);
  clearInterval(timer);
  timer = setInterval(() => refresh(false), 60000);      // pick up changes while the tab is open
}

async function refresh(loud){
  const txt = document.getElementById('live-txt');
  if (loud) txt.textContent = 'Checking…';
  try {
    const data = await fetchBoard();
    if (data.ok) render(data);
  } catch (e){
    txt.textContent = 'Couldn’t reach the server — showing the last update.';
    document.getElementById('dot').style.background = '#d98324';
  }
}

function render(data){
  document.title = (data.event && data.event.name ? data.event.name : 'Your Event') + ' | R3 Media Production';
  document.getElementById('ev-name').textContent = data.event && data.event.name ? data.event.name : 'Your Event';
  document.getElementById('ev-sum').textContent =
    data.total ? `${data.delivered} of ${data.total} sessions delivered.` : 'Sessions will appear here as they go into production.';
  document.getElementById('dot').style.background = '#2ea86a';
  document.getElementById('live-txt').textContent = 'Live — updated ' + new Date().toLocaleTimeString();

  let html = '', lastDay = null;
  (data.sessions || []).forEach(s => {
    if ((s.day || '') !== lastDay){
      lastDay = s.day || '';
      if (lastDay) html += `<tr><td colspan="2" class="day-head">${esc(lastDay)}</td></tr>`;
    }
    const colour = COLOURS[s.status] || '#6b6b74';
    const meta = [roomLabel(s.room, s.roomName), timeHuman(s.time)].filter(Boolean).join(' &middot; ');
    const watch = s.vimeo
      ? `<a class="btn sm" href="${esc(s.vimeo)}" target="_blank" rel="noopener">Watch</a>`
      : '';
    html += `<tr>
      <td>
        <div class="t">${esc(s.title || 'Untitled session')}</div>
        ${meta ? `<div class="d">${meta}</div>` : ''}
        ${s.note ? `<div class="note">${esc(s.note)}</div>` : ''}
      </td>
      <td class="btns">
        ${watch}
        <span class="badge" style="color:${colour}; border:1px solid ${colour}66; background:${colour}1f;">${esc(s.label || s.status)}</span>
      </td>
    </tr>`;
  });

  document.getElementById('tbl').innerHTML = html ||
    '<tr><td class="muted">Nothing posted yet — check back soon.</td></tr>';
}

(async function start(){
  if (!EVENT){
    document.getElementById('err').textContent = 'This link is missing its event code. Use the link from your delivery email.';
    document.getElementById('err').style.display = 'block';
    return;
  }
  if (password){                       // already unlocked this browser session
    try {
      const data = await fetchBoard();
      if (data.ok) return showBoard(data);
    } catch (e){}
    sessionStorage.removeItem('r3-pw-' + EVENT);
  }
  document.getElementById('pw').focus();
})();
</script>

</body>
</html>
